<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0E0E">
<title>More tab test</title>
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="../../app-tokens.css">
<link rel="stylesheet" href="../../app-shell.css">
<link rel="stylesheet" href="../../pay/pay.css">
<link rel="stylesheet" href="more.css">
</head>
<body>
<main class="shell-main" id="page" style="max-width:520px;margin:0 auto;padding:12px 16px 40px;">
  <div id="more"></div>
</main>

<!-- Test page only: mock data and mock handlers. The shell supplies the real ones. -->
<script src="../../config.js"></script>
<script src="../../pay/pay.js"></script>
<script src="more.js"></script>
<script>
  /* Open with ?p=pay, details, alerts, rules or help to jump straight to a panel. ?bright=1 for Bright hall, ?theme=light for light. */
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
    if (q.get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    var data = {
      me: { first: 'Sam', lastInitial: 'K', nickname: '', teamPref: 'blue' },
      bright: q.get('bright') === '1',
      alertsOn: false,
      tonight: { nightId: 'tonight', label: 'Thursday, 8pm', amount: '£5', status: q.get('paid') === '1' ? 'paid' : 'due' },
      history: [
        { nightId: 'n3', label: 'Thu 6 Nov', amount: '£5', status: 'paid' },
        { nightId: 'n2', label: 'Sun 2 Nov', amount: '£5', status: 'paid' },
        { nightId: 'n1', label: 'Thu 30 Oct', amount: '£5', status: 'claimed' }
      ],
      cfg: window.PLAYER_APP_CONFIG,
      version: '0.2 (More tab)'
    };

    var log = [];
    var handlers = {
      claimPaid: function (nightId) { log.push('claimPaid ' + nightId); data.tonight.status = 'claimed'; return Promise.resolve({ ok: true }); },
      saveProfile: function (next) { log.push('saveProfile ' + JSON.stringify(next)); return Promise.resolve({ ok: true }); },
      setBright: function (on) { log.push('bright ' + on); },
      setAlerts: function (on) { log.push('alerts ' + on); },
      logOut: function () { log.push('logOut'); }
    };
    window.__moreLog = log;

    var m = PlayerMore.mount(document.getElementById('more'), data, handlers);
    var p = q.get('p');
    if (p) m.show(p);
  })();
</script>
</body>
</html>
