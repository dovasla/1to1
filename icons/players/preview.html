<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player icons preview</title>
<style>
:root{--pi-bg:#0B1A33;--pi-fg:#FFD60A;--page:#0B1A33;--ink:#F5F7FB;--muted:#B8C2D6}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--page:#F4F6FA;--ink:#0B1A33;--muted:#44506A}}
:root[data-theme="light"]{--page:#F4F6FA;--ink:#0B1A33;--muted:#44506A}
:root[data-theme="dark"]{--page:#0B1A33;--ink:#F5F7FB;--muted:#B8C2D6}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,Arial,sans-serif}
main{max-width:430px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 4px;text-transform:uppercase;letter-spacing:.02em}
p.lede{color:var(--muted);font-size:14px;margin:0 0 12px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);margin:20px 0 8px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;justify-items:center;align-items:start}
.row.big figure{margin:0;text-align:center}
figcaption{font-size:12px;line-height:1.3;color:var(--muted);margin-top:4px}
code{font-size:11px}
.row.small{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;padding:8px;border-radius:12px;background:rgba(127,127,127,.12)}
.tog{display:flex;gap:8px;margin:8px 0}
.tog button{min-height:48px;padding:0 14px;border-radius:12px;border:2px solid #FFD60A;background:#FFD60A;color:#0B1A33;font-weight:700;font-size:14px}
</style></head>

<h1>Player icons</h1>
<p class="lede">60 icons, 6 groups of 10. Each icon sits on a dark disc, so it reads on dark and light pages. Small row = 28px check.</p>
