<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0E0E">
<title>Shop</title>
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="shop-v2.css">
<link rel="stylesheet" href="shop-effects.css">
</head>
<body class="shop-v2">
<main>
  <header class="top">
    <h1>Shop</h1>
    <span class="coins" aria-live="polite"><span id="coins">&nbsp;</span>&nbsp;coins</span>
  </header>

  <p class="err" id="loadErr" hidden>Could not load the shop. Check the signal and try again.</p>
  <button class="btn ghost" id="retry" type="button" hidden>Try again</button>

  <section class="banner" id="banner" aria-label="Your banner"></section>
  <div class="collect"><span id="collectLabel">Collection</span><span id="collectCount"></span></div>
  <div class="bar"><span id="collectBar"></span></div>
  <p class="next" id="nextLine"></p>

  <nav class="tabs" id="tabs" aria-label="Shop sections"></nav>
  <div id="grid" aria-live="polite"><p class="muted">Loading the shop...</p></div>

  <h2 class="cap">Your loadout</h2>
  <ul class="loadout" id="loadout"></ul>
  <button class="btn ghost" id="takeAll" type="button">Take all off</button>
  <p class="err" id="takeErr" hidden></p>
</main>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT" hidden>
  <div class="grab" aria-hidden="true"></div>
  <h2 id="sheetT" tabindex="-1"></h2>
  <div class="sheet-preview" id="sheetPreview" aria-label="Preview"></div>
  <p class="rarity" id="sheetRarity"></p>
  <p class="muted" id="sheetInfo"></p>
  <p class="err" id="sheetErr" hidden></p>
  <button class="btn" id="sheetBuy" type="button" hidden></button>
  <button class="btn" id="sheetEquip" type="button" hidden>Equip</button>
  <button class="btn ghost" id="sheetTry" type="button">Try it on the banner</button>
  <button class="btn ghost" id="sheetClose" type="button">Close</button>
</section>

<script src="../lib/player-name.js"></script>
<script src="cosmetics.js"></script>
<script src="shop-rules.js"></script>
<script src="catalogue.js"></script>
<script src="shop-rules-v2.js"></script>
<script src="shop-backend.js"></script>
<script src="shop-effects.js"></script>
<script src="shop-v2.js"></script>
</body>
</html>
